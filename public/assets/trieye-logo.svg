<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="100%" height="100%">
  <defs>
    <!-- Pink Gradient for TRI -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f04a88"/>
      <stop offset="100%" stop-color="#dc1e64"/>
    </linearGradient>
    
    <!-- Green Gradient for EYE -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6e33a"/>
      <stop offset="100%" stop-color="#93c41f"/>
    </linearGradient>

    <!-- Subtle Bevel/Glow Filters -->
    <filter id="crispGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .tri-fill { fill: url(#pinkGrad); }
    .eye-fill { fill: url(#greenGrad); }
    .tagline-text {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.38em;
      fill: var(--text-primary, currentColor);
    }
  </style>

  <!-- ==================== TRI (PINK) ==================== -->
  <g class="tri-fill">
    <!-- T -->
    <!-- Top bar -->
    <rect x="20" y="25" width="140" height="24" rx="2" />
    <!-- Vertical stem -->
    <rect x="76" y="49" width="28" height="115" rx="2" />

    <!-- R -->
    <!-- Left vertical bar -->
    <rect x="180" y="25" width="28" height="139" rx="2" />
    <!-- Loop + Upper bar + Middle bar -->
    <path d="M 180 25
             H 295
             C 335 25, 345 52, 345 76
             C 345 100, 335 125, 295 125
             H 180 Z
             M 208 50
             V 100
             H 290
             C 308 100, 317 90, 317 75
             C 317 60, 308 50, 290 50
             Z" />
    <!-- Diagonal Leg -->
    <polygon points="262,118 316,118 362,164 322,164" />

    <!-- I -->
    <rect x="382" y="25" width="28" height="139" rx="2" />
  </g>

  <!-- ==================== EYE (LIME GREEN) ==================== -->
  <g class="eye-fill">
    <!-- E1 (3 Horizontal Bars) -->
    <rect x="445" y="25" width="142" height="25" rx="3" />
    <rect x="445" y="82" width="142" height="25" rx="3" />
    <rect x="445" y="139" width="142" height="25" rx="3" />

    <!-- Y -->
    <!-- Left branch -->
    <polygon points="606,25 640,25 690,95 660,95" />
    <!-- Right branch -->
    <polygon points="768,25 734,25 672,108 702,108" />
    <!-- Vertical stem -->
    <rect x="672" y="98" width="30" height="66" rx="2" />

    <!-- E2 (3 Horizontal Bars) -->
    <rect x="792" y="25" width="142" height="25" rx="3" />
    <rect x="792" y="82" width="142" height="25" rx="3" />
    <rect x="792" y="139" width="142" height="25" rx="3" />
  </g>

  <!-- ==================== TAGLINE ==================== -->
  <text x="480" y="228" text-anchor="middle" class="tagline-text">DETAIL  PRECISION  PROTECTION</text>
</svg>
